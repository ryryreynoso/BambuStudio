# XcodeGen project: `xcodegen generate` in this folder creates PrinterCompanion.xcodeproj.
name: PrinterCompanion
options:
  bundleIdPrefix: io.github.ryryreynoso
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Raise for every TestFlight upload; App Store Connect rejects a build number it already has.
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 4M5EAZDQVN
    CODE_SIGN_STYLE: Automatic
targets:
  PrinterCompanion:
    type: application
    platform: iOS
    sources: [Sources, Resources/Assets.xcassets]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Printer Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard TLS (Bambu's MQTT over TLS), which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # iPad multitasking requires every orientation, or App Store Connect rejects the upload.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: "Printer Companion reads the status of printers on your local network."
        # Plain HTTP only for addresses on the local network (Moonraker); everything else keeps ATS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ryryreynoso.PrinterCompanion
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PrinterCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PrinterCompanion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PrinterCompanion:
    build:
      targets:
        PrinterCompanion: all
        PrinterCompanionTests: [test]
    test:
      targets: [PrinterCompanionTests]
